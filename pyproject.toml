[build-system]
requires = ["setuptools>=68", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-kits"
dynamic = ["version"]
description = "Portable engineering kits for AI coding tools."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "ai",
    "coding-agents",
    "claude-code",
    "cursor",
    "codex",
    "gemini",
    "opencode",
    "developer-tools",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
authors = [{name = "Vibe Engineering"}]
license = {text = "MIT"}
dependencies = [
    'tomli>=1.1; python_version < "3.11"',
]

[project.urls]
Homepage = "https://github.com/kidboy-man/vibe-engineering"
Documentation = "https://github.com/kidboy-man/vibe-engineering/tree/main/docs/kits"
Source = "https://github.com/kidboy-man/vibe-engineering"
Issues = "https://github.com/kidboy-man/vibe-engineering/issues"
Changelog = "https://github.com/kidboy-man/vibe-engineering/releases"

[project.scripts]
vibe = "agents.cli:main"

[tool.setuptools_scm]

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-data]
agents = ["kits/*/templates/**/*"]
